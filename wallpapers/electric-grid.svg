<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080f"/>
      <stop offset=".55" stop-color="#0a1120"/>
      <stop offset="1" stop-color="#101a30"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5865F2" stop-opacity="0"/>
      <stop offset=".45" stop-color="#7E8AFB"/>
      <stop offset="1" stop-color="#4FA3A5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#05080f" stop-opacity=".8"/>
      <stop offset=".5" stop-color="#05080f" stop-opacity="0"/>
      <stop offset="1" stop-color="#05080f" stop-opacity=".8"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
