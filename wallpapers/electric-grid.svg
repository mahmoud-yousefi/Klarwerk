  <path d="M-40 1000 L520 470 L1000 470 L1500 120 L1980 120" fill="none" stroke="url(#beam)" stroke-width="5" filter="url(#glow)" opacity=".55"/>
  <path d="M-40 1000 L520 470 L1000 470 L1500 120 L1980 120" fill="none" stroke="url(#beam)" stroke-width="1.6"/>
  <g fill="#A5AEFF">
    <circle cx="520" cy="470" r="4"/><circle cx="1000" cy="470" r="4"/><circle cx="1500" cy="120" r="4"/>
  </g>
  <g fill="none" stroke="#7E8AFB" stroke-opacity=".25">
